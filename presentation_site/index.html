<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Millingen Architects — presentation deck. Edit js/slides.config.js to change the slides." />
    <title>Millingen Architects — Presentation</title>

    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="preconnect" href="https://www.youtube.com" />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main id="deck" class="deck" role="region" aria-roledescription="carousel" aria-label="Presentation" aria-live="off">
      <!-- slides are appended into this viewport -->
      <div class="deck-viewport" id="deckViewport"></div>

      <!-- loading overlay -->
      <div class="deck-loader" id="deckLoader" aria-hidden="true">
        <div class="deck-loader__spinner glass"></div>
        <p class="deck-loader__text">Loading presentation…</p>
        <div class="deck-loader__progress">
          <div class="deck-loader__progress-bar" id="loaderProgress"></div>
        </div>
      </div>

      <!-- brand / title (populated from config meta) -->
      <header class="deck-brand" id="deckBrand"></header>

      <!-- prev / next -->
      <button class="deck-arrow deck-arrow--prev glass" id="btnPrev" type="button" aria-label="Previous slide">
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>

      <button class="deck-arrow deck-arrow--next glass" id="btnNext" type="button" aria-label="Next slide">
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>

      <!-- slide counter -->
      <div class="deck-footer" id="deckFooter"></div>

      <!-- Combined controls panel -->
      <div class="deck-controls" id="deckControls">
        <button class="deck-controls-toggle glass" id="toggleControls" type="button" aria-label="Toggle controls">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>

        <div class="deck-controls-panel glass" id="controlsPanel">
          <!-- dots / slide progress -->
          <nav class="deck-dots" id="deckDots" aria-label="Slide navigation"></nav>

          <!-- autoplay / loop toggles -->
          <div class="deck-toggles" role="group" aria-label="Playback controls">
            <button class="toggle on" id="toggleAutoplay" type="button" role="switch" aria-checked="true" aria-label="Autoplay">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Autoplay</span>
            </button>

            <button class="toggle on" id="toggleLoop" type="button" role="switch" aria-checked="true" aria-label="Loop">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
              <span class="toggle-label">Loop</span>
            </button>

            <!-- See more button -->
            <button class="toggle-seemore hidden" id="toggleSeemore" type="button" aria-label="See more">
              <span class="seemore-track">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
                  <polyline points="15 3 21 3 21 9" />
                  <line x1="10" y1="14" x2="21" y2="3" />
                </svg>
              </span>
              <span class="seemore-label">See more</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <noscript>
      <p style="position: fixed; inset: 0; display: grid; place-items: center; color: #fff; background: #0b0b0f; font-family: sans-serif">
        This presentation requires JavaScript. Please enable it and reload.
      </p>
    </noscript>

    <script src="js/slides.config.js" defer></script>
    <script src="js/deck.js" defer></script>
  </body>
</html>
